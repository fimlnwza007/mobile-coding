
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>เป่ากบ 3D - Third Person</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #172019;
  color: white;
  font-family: system-ui, sans-serif;
}

canvas {
  display: block;
  touch-action: none;
}

#hud {
  position: fixed;
  inset: 0;
  padding: 12px;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.panel {
  background: #142019dd;
  border: 1px solid #ffffff24;
  border-radius: 14px;
  padding: 12px;
  backdrop-filter: blur(8px);
}

.top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: flex-start;
}

h2 { font-size: 18px; margin: 0 0 5px; }
.small { font-size: 12px; color: #c7d2ca; }
#turn { font-weight: bold; font-size: 16px; }
#status { font-size: 13px; margin-top: 6px; }

.bottom {
  display: flex;
  justify-content: center;
}

.controls {
  width: min(440px, 100%);
  pointer-events: auto;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px;
  font-weight: bold;
  background: #e5eee7;
  color: #152219;
  cursor: pointer;
  touch-action: manipulation;
}

button.primary {
  background: #ffc15d;
}

button:disabled { opacity: .5; }

#meter {
  height: 9px;
  background: #36453a;
  border-radius: 10px;
  margin-top: 10px;
  overflow: hidden;
}

#bar {
  width: 0%;
  height: 100%;
  background: #72ed9a;
}

#powerText { font-size: 12px; margin-top: 5px; }

#start, #resultScreen {
  position: fixed;
  inset: 0;
  background: #000b;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.modal {
  width: min(420px, 100%);
  padding: 24px;
  text-align: center;
  border-radius: 18px;
  background: #202c23;
  border: 1px solid #526456;
}

.modal p {
  font-size: 14px;
  line-height: 1.8;
  color: #d5ded7;
}

.hidden { display: none !important; }

#aimHint {
  text-align: center;
  margin-top: 7px;
  font-size: 12px;
  color: #e4d4a5;
}

@media(max-width: 500px) {
  #hud { padding: 8px; }
  .panel { padding: 10px; }
  h2 { font-size: 16px; }
  button { padding: 10px; font-size: 12px; }
}
</style>
</head>

<body>

<div id="start">
  <div class="modal">
    <h2>🐸 เป่ากบ 3D</h2>
    <p>
      <b>ลากหน้าจอ</b> เพื่อหมุนกล้องและเล็งทิศทาง<br>
      <b>เป่าไมค์</b> เพื่อยิงหนังยาง<br>
      กล้องจะอยู่ที่เดิมระหว่างหนังยางพุ่ง<br>
      เมื่อหนังยางหยุด กล้องจึงย้ายไปยังผู้เล่นอีกคน
    </p>
    <button class="primary" id="startBtn">เริ่มเล่น</button>
  </div>
</div>

<div id="resultScreen" class="hidden">
  <div class="modal">
    <h2>🏆 จบเกม!</h2>
    <p id="winnerText"></p>
    <button class="primary" id="againBtn">เล่นอีกครั้ง</button>
  </div>
</div>

<div id="hud">
  <div class="top">
    <div class="panel">
      <h2>🐸 เป่ากบ 3D</h2>
      <div id="turn">ผู้เล่น 1</div>
      <div id="status">เตรียมเล็ง</div>
    </div>
    <div class="panel">
      <div class="small">ผู้เล่น 1</div>
      <b style="color:#ff984d">● สีส้ม</b>
      <div class="small" style="margin-top:6px">ผู้เล่น 2</div>
      <b style="color:#64caff">● สีฟ้า</b>
    </div>
  </div>

  <div class="bottom">
    <div class="panel controls">
      <div class="row">
        <button id="micBtn">🎙 เปิดไมค์</button>
        <button id="shootBtn" class="primary">💨 ยิง</button>
        <button id="resetBtn">↻ เริ่มใหม่</button>
      </div>
      <div id="meter"><div id="bar"></div></div>
      <div id="powerText">แรงยิง: 0%</div>
      <div id="aimHint">ลากหน้าจอเพื่อหมุนกล้องเล็ง</div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

const $ = id => document.getElementById(id);

// ==========================================
// Scene
// ==========================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x18231c);
scene.fog = new THREE.Fog(0x18231c, 16, 35);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 100
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe3f4e5, 0x51402b, 2));

const sunlight = new THREE.DirectionalLight(0xffe5bd, 3);
sunlight.position.set(-5, 10, 6);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(1024, 1024);
scene.add(sunlight);

// ==========================================
// Wooden board
// ==========================================

const W = 8;
const D = 10;

const board = new THREE.Mesh(
  new THREE.BoxGeometry(W, 0.35, D),
  new THREE.MeshStandardMaterial({
    color: 0x98633b,
    roughness: 0.8
  })
);
board.position.y = -0.19;
board.receiveShadow = true;
board.castShadow = true;
scene.add(board);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x29352b })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.39;
floor.receiveShadow = true;
scene.add(floor);

const woodLineMat = new THREE.MeshStandardMaterial({
  color: 0x6c4327
});

for (let i = 0; i < 18; i++) {
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(7.85, 0.008, 0.018),
    woodLineMat
  );
  line.position.set(0, 0.01, -4.6 + i * 0.54);
  scene.add(line);
}

const edgeMat = new THREE.MeshStandardMaterial({ color: 0x4c2f1d });

function edge(w, h, d, x, y, z) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d), edgeMat
  );
  m.position.set(x, y, z);
  m.castShadow = true;
  scene.add(m);
}

edge(8.2, 0.18, 0.18, 0, -0.05, -5.05);
edge(8.2, 0.18, 0.18, 0, -0.05, 5.05);
edge(0.18, 0.18, 10, -4.05, -0.05, 0);
edge(0.18, 0.18, 10, 4.05, -0.05, 0);

// ==========================================
// Two rubber bands only
// ==========================================

const bands = [];
const R = 0.43;

function makeBand(owner, x, z) {
  const color = owner === 0 ? 0xff873f : 0x5bc7ff;

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(R, 0.09, 14, 48),
    new THREE.MeshStandardMaterial({
      color,
      roughness: 0.45,
      emissive: color,
      emissiveIntensity: 0.08
    })
  );

  ring.rotation.x = Math.PI / 2;
  ring.position.set(x, 0.12, z);
  ring.castShadow = true;
  ring.userData.owner = owner;
  ring.userData.velocity = new THREE.Vector3();
  ring.userData.moving = false;

  scene.add(ring);

  const halo = new THREE.Mesh(
    new THREE.RingGeometry(0.55, 0.63, 48),
    new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.25,
      side: THREE.DoubleSide
    })
  );

  halo.rotation.x = -Math.PI / 2;
  halo.position.set(x, 0.025, z);
  scene.add(halo);

  ring.userData.halo = halo;
  bands.push(ring);
  return ring;
}

// ==========================================
// Third-person camera aiming
// ==========================================

// มุมกล้องที่หมุนได้ระหว่างเล็ง
let yaw = 0;
let pitch = 0.52;
let cameraDistance = 4.2;

const MIN_PITCH = 0.12;
const MAX_PITCH = 1.0;

let current = 0;
let activeBand = null;

let phase = 'aim';
// aim = เล็ง
// flying = หนังยางกำลังพุ่ง
// switching = กำลังเปลี่ยนตา
// ended = จบเกม

let power = 0;
let micLevel = 0;
let shotPower = 0;
let gameStarted = false;
let micEnabled = false;

function getCameraPosition(target, y, angle, distance) {
  return new THREE.Vector3(
    target.x + Math.sin(angle) * distance,
    y + Math.sin(pitch) * distance,
    target.z + Math.cos(angle) * distance
  );
}

function positionCameraForTurn() {
  if (!activeBand) return;

  // กล้องเริ่มด้านหลังหนังยางที่กำลังควบคุม
  const b = activeBand.position;

  // ผู้เล่น 1 เริ่มจากด้านล่างกระดาน
  // ผู้เล่น 2 เริ่มจากด้านบนกระดาน
  yaw = current === 0 ? Math.PI : 0;
  pitch = 0.52;

  camera.position.copy(
    getCameraPosition(b, 0.12, yaw, cameraDistance)
  );

  camera.lookAt(b.x, 0.1, b.z);
}

// ==========================================
// Aim line
// ==========================================

let aimLine = null;

function updateAimLine() {
  if (aimLine) {
    scene.remove(aimLine);
    aimLine.geometry.dispose();
    aimLine = null;
  }

  if (phase !== 'aim' || !activeBand) return;

  const origin = activeBand.position.clone();
  origin.y = 0.22;

  // ทิศทางเล็งตามทิศที่กล้องมอง
  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);
  direction.y = 0;

  if (direction.lengthSq() < 0.001) return;
  direction.normalize();

  const end = origin.clone().addScaledVector(direction, 2.5);
  end.y = 0.22;

  const geometry = new THREE.BufferGeometry().setFromPoints([
    origin, end
  ]);

  aimLine = new THREE.Line(
    geometry,
    new THREE.LineBasicMaterial({ color: 0xffffff })
  );
  scene.add(aimLine);
}

// ==========================================
// Touch / mouse camera controls
// ==========================================

let pointerDown = false;
let lastX = 0;
let lastY = 0;
let pointerMoved = false;

renderer.domElement.addEventListener('pointerdown', e => {
  if (!gameStarted || phase !== 'aim') return;

  pointerDown = true;
  pointerMoved = false;
  lastX = e.clientX;
  lastY = e.clientY;

  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', e => {
  if (!pointerDown || phase !== 'aim') return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  if (Math.abs(dx) + Math.abs(dy) > 1) {
    pointerMoved = true;
  }

  // ลากซ้าย-ขวา หมุนรอบหนังยาง
  yaw -= dx * 0.008;

  // ลากขึ้น-ลง ปรับมุมกล้อง
  pitch = THREE.MathUtils.clamp(
    pitch + dy * 0.006,
    MIN_PITCH,
    MAX_PITCH
  );

  lastX = e.clientX;
  lastY = e.clientY;

  updateAimCamera();
});

renderer.domElement.addEventListener('pointerup', () => {
  pointerDown = false;
});

renderer.domElement.addEventListener('pointercancel', () => {
  pointerDown = false;
});

function updateAimCamera() {
  if (!activeBand || phase !== 'aim') return;

  const b = activeBand.position;

  camera.position.copy(
    getCameraPosition(b, 0.12, yaw, cameraDistance)
  );

  camera.lookAt(b.x, 0.12, b.z);
}

// ==========================================
// Launch rubber band
// ==========================================

function shoot() {
  if (!gameStarted || phase !== 'aim' || !activeBand) return;

  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);

  // หนังยางวิ่งบนพื้นกระดาน
  direction.y = 0;

  if (direction.lengthSq() < 0.001) return;
  direction.normalize();

  // เสียงไมค์ช่วยเพิ่มแรง
  const finalPower = Math.max(power, 0.2);
  const speed = 3.0 + finalPower * 8.5;

  activeBand.userData.velocity.set(
    direction.x * speed,
    0,
    direction.z * speed
  );

  activeBand.userData.moving = true;

  // สำคัญ: ไม่เรียก updateAimCamera อีกระหว่างบิน
  // ตำแหน่งและมุมกล้องจะค้างอยู่ตรงจุดยิง
  phase = 'flying';
  shotPower = finalPower;
  pointerDown = false;

  $('status').textContent = 'หนังยางกำลังพุ่ง...';
  $('aimHint').textContent = 'กล้องค้างที่จุดยิง ไม่ตามหนังยาง';
  $('shootBtn').disabled = true;
}

// ==========================================
// Physics
// ==========================================

function updatePhysics(dt) {
  if (phase !== 'flying') return;

  const b = activeBand;
  const v = b.userData.velocity;

  b.position.x += v.x * dt;
  b.position.z += v.z * dt;

  // แรงเสียดทาน
  v.multiplyScalar(Math.pow(0.985, dt * 60));

  const maxX = W / 2 - R - 0.2;
  const maxZ = D / 2 - R - 0.2;

  if (b.position.x < -maxX) {
    b.position.x = -maxX;
    v.x = Math.abs(v.x) * 0.5;
  }

  if (b.position.x > maxX) {
    b.position.x = maxX;
    v.x = -Math.abs(v.x) * 0.5;
  }

  if (b.position.z < -maxZ) {
    b.position.z = -maxZ;
    v.z = Math.abs(v.z) * 0.5;
  }

  if (b.position.z > maxZ) {
    b.position.z = maxZ;
    v.z = -Math.abs(v.z) * 0.5;
  }

  b.userData.halo.position.x = b.position.x;
  b.userData.halo.position.z = b.position.z;

  // ตรวจว่าทับอีกวงหรือไม่
  const other = bands.find(x => x !== b);

  const dx = b.position.x - other.position.x;
  const dz = b.position.z - other.position.z;
  const distance = Math.hypot(dx, dz);

  if (distance < 0.58) {
    endGame(current);
    return;
  }

  // รอจนหยุดสนิท แล้วค่อยเปลี่ยนผู้เล่น
  if (v.length() < 0.22) {
    v.set(0, 0, 0);
    b.userData.moving = false;
    switchTurn();
  }
}

// ==========================================
// Turn switching
// ==========================================

function switchTurn() {
  if (phase !== 'flying') return;

  phase = 'switching';
  $('status').textContent = 'หนังยางหยุดแล้ว กำลังเปลี่ยนตา...';

  setTimeout(() => {
    if (phase !== 'switching') return;

    current = current === 0 ? 1 : 0;
    activeBand = bands.find(b => b.userData.owner === current);

    // กล้องย้ายไปยังวงของผู้เล่นคนใหม่
    positionCameraForTurn();

    power = 0;
    phase = 'aim';

    $('turn').textContent = `ตาของผู้เล่น ${current + 1}`;
    $('status').textContent = `เล็งหนังยางของผู้เล่น ${current + 1}`;
    $('aimHint').textContent = 'ลากหน้าจอเพื่อหมุนกล้องเล็ง';
    $('shootBtn').disabled = false;
    $('powerText').textContent = 'แรงยิง: 0%';

    updateAimLine();
  }, 450);
}

// ==========================================
// Microphone
// ==========================================

let audioContext = null;
let analyser = null;
let micStream = null;
let micBuffer = null;
let wasBlowing = false;

$('micBtn').addEventListener('click', async () => {
  if (micEnabled) {
    stopMic();
    return;
  }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    audioContext = new AudioContext();

    const source = audioContext.createMediaStreamSource(micStream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.5;
    source.connect(analyser);

    micBuffer = new Uint8Array(analyser.fftSize);
    micEnabled = true;

    $('micBtn').textContent = '🔇 ปิดไมค์';
    $('status').textContent = 'ไมค์พร้อมแล้ว เป่าเพื่อชาร์จและยิง';

  } catch (err) {
    console.error(err);
    alert('เปิดไมค์ไม่ได้ กรุณาอนุญาตไมโครโฟนและใช้ localhost หรือ HTTPS');
  }
});

function stopMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioContext) audioContext.close();

  micStream = null;
  audioContext = null;
  analyser = null;
  micBuffer = null;
  micEnabled = false;
  wasBlowing = false;

  $('micBtn').textContent = '🎙 เปิดไมค์';
}

function updateMic(dt) {
  if (!micEnabled || !analyser || phase !== 'aim') {
    micLevel *= 0.9;
    return;
  }

  analyser.getByteTimeDomainData(micBuffer);

  let sum = 0;
  for (let i = 0; i < micBuffer.length; i++) {
    const n = (micBuffer[i] - 128) / 128;
    sum += n * n;
  }

  const rms = Math.sqrt(sum / micBuffer.length);
  micLevel = Math.max(0, (rms - 0.012) * 5);

  const blowing = micLevel > 0.12;

  if (blowing) {
    // เพิ่มแรงระหว่างเป่า
    power = Math.min(1, power + dt * (0.35 + micLevel));
  }

  $('bar').style.width = `${Math.round(power * 100)}%`;
  $('powerText').textContent =
    `แรงยิง: ${Math.round(power * 100)}%`;

  // เริ่มเป่าเพื่อชาร์จ พอหยุดเป่าจึงยิง
  if (wasBlowing && !blowing && power > 0.08) {
    shoot();
  }

  wasBlowing = blowing;
}

// ==========================================
// Game state
// ==========================================

function endGame(winner) {
  phase = 'ended';

  $('winnerText').textContent =
    `ผู้เล่น ${winner + 1} ชนะ! หนังยางทับอีกฝ่ายได้สำเร็จ`;

  $('resultScreen').classList.remove('hidden');
}

function resetGame() {
  for (const b of bands) {
    scene.remove(b);
    scene.remove(b.userData.halo);
    b.geometry.dispose();
    b.material.dispose();
    b.userData.halo.geometry.dispose();
    b.userData.halo.material.dispose();
  }

  bands.length = 0;

  // มีหนังยางเพียง 2 วง
  makeBand(0, 0, 3.1);
  makeBand(1, 0, -3.1);

  current = 0;
  activeBand = bands[0];
  power = 0;
  micLevel = 0;
  phase = 'aim';

  $('turn').textContent = 'ตาของผู้เล่น 1';
  $('status').textContent = 'เล็งหนังยางของผู้เล่น 1';
  $('shootBtn').disabled = false;
  $('resultScreen').classList.add('hidden');

  positionCameraForTurn();
  updateAimLine();
}

$('shootBtn').addEventListener('click', shoot);
$('resetBtn').addEventListener('click', resetGame);
$('againBtn').addEventListener('click', resetGame);

$('startBtn').addEventListener('click', () => {
  gameStarted = true;
  $('start').classList.add('hidden');
  resetGame();
});

// ==========================================
// Main loop
// ==========================================

let previous = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - previous) / 1000, 0.04);
  previous = now;

  updateMic(dt);
  updatePhysics(dt);

  if (phase === 'aim') {
    updateAimLine();

    // ตอนเล็ง กล้องขยับตามการหมุนรอบ activeBand
    // ตอนบินจะไม่เรียกฟังก์ชันนี้
    if (!pointerDown) {
      updateAimCamera();
    }
  }

  // ยกวงที่ควบคุมเล็กน้อย
  for (const b of bands) {
    b.position.y =
      b === activeBand && phase === 'aim' ? 0.19 : 0.12;

    b.userData.halo.position.x = b.position.x;
    b.userData.halo.position.z = b.position.z;

    b.userData.halo.material.opacity =
      b === activeBand && phase === 'aim' ? 0.55 : 0.22;
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
